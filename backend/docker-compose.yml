services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: illusions_user
      POSTGRES_PASSWORD: illusions_pass
      POSTGRES_DB: illusions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U illusions_user -d illusions"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://illusions_user:illusions_pass@db:5432/illusions
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
